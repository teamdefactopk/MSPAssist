name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }}, MySQL 8)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mspassist_test
          MYSQL_USER: mspassist
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, fileinfo, gd, zip, intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests on SQLite
        run: php artisan test
      - name: Tests on MySQL
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mspassist_test
          DB_USERNAME: mspassist
          DB_PASSWORD: ci-only-password
      - name: Migrations and demo seed on MySQL
        run: php artisan migrate:fresh --seed --seeder=DemoSeeder --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: mspassist_test
          DB_USERNAME: mspassist
          DB_PASSWORD: ci-only-password
      - run: composer audit --no-interaction

  flutter:
    name: Flutter analyze, test, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /app/ --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/flutter_app/build/web
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Debug-signed build for testing only; release signing is configured
      # separately with secrets and is never stored in the repository.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
